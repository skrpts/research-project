  name: "Research Project"
  preamble: "documents/research-project-preamble.md"
  skrpts:
    - slug: "literature-review-pipeline"
      version: "1.2.34"
      content_digest: "sha256:66c287865ad1fdc0671d47859e8845bbf9148fd71967770f8df146cad1557de9"
